# =====================================================================
# Rocco Siffredi — head-to-head league, one start per player per season
# =====================================================================
# IMPORTANT: the values below marked [ASSUMED] could not be read from the
# league site (https://rocco-siffredi.onrender.com is blocked by this
# environment's network egress policy).  They are the standard survivor-fantasy
# defaults.  Correct anything that differs and every downstream number --
# projections, survival odds, the season plan -- updates automatically.
#
# Run `seedman league doctor` for a checklist of exactly what to verify.

league:
  name: Rocco Siffredi
  season: 2026

survival:
  # [CONFIRMED by the commissioner] Not a survivor pool. You play one opponent a
  # week, nobody is eliminated weekly, and the one rule that makes this league
  # unusual is that each NFL player may be started only once all season.
  mode: head_to_head

  # [CONFIRMED] Each NFL player may be started this many times all season. This
  # single number is what creates the "spend now vs. save" tension, and in a
  # head-to-head league it is the ONLY thing that does.
  player_reuse_limit: 1

  # [CONFIRMED] Roughly 15 regular-season weeks, then a two-week playoff.
  regular_season_final_week: 15
  final_week: 17

  # [ASSUMED] Teams in the league, and how many make the bracket. Half the
  # league is the usual split; this drives how many wins a berth costs, which
  # drives how much a regular-season point is worth against a playoff point.
  teams_remaining: 12
  playoff_berths: 6

  as_of_week: 1
  # Unused in head_to_head mode, kept so the survivor path still validates.
  eliminations_per_week: 1

roster:
  # [CONFIRMED from the league site, week 1 lineup screen] Six slots, no bench,
  # no kicker and no team defense. Two separate WR slots plus a flex.
  slots:
    - {name: QB,   eligible: [QB]}
    - {name: RB,   eligible: [RB]}
    - {name: WR1,  eligible: [WR]}
    - {name: WR2,  eligible: [WR]}
    - {name: TE,   eligible: [TE]}
    # [CONFIRMED] Flex seen holding both a WR and an RB on real lineup cards;
    # TE eligibility is the remaining piece of convention.
    - {name: FLEX, eligible: [RB, WR, TE]}

scoring:
  # [CONFIRMED by the commissioner] Half PPR.
  passing_yards: 0.04
  passing_tds: 4
  passing_interceptions: -2
  rushing_yards: 0.1
  rushing_tds: 6
  receptions: 0.5
  receiving_yards: 0.1
  receiving_tds: 6
  fumbles_lost: -2
  two_point_conversions: 2
  special_teams_tds: 6

  # [CONFIRMED from a week 1 box score] No yardage bonuses. Chris Olave went for
  # 182 receiving yards and the league scored him 23.20, which is exactly half
  # PPR with no century bonus; all six players on that lineup card reconcile to
  # the cent, and the card's 82.46 total matches only with `bonuses` empty.
  bonuses: []


# Surfaced in every report so stale guesses cannot quietly drive decisions.
assumptions:
  - "Half PPR CONFIRMED (0.5 per reception)."
  - "No yardage bonuses — CONFIRMED by reconciling a week 1 lineup card to the cent (82.46)."
  - "Lineup CONFIRMED from the league site: QB/RB/WR/WR/TE/FLEX, no kicker, no defense."
  - "FLEX takes RB and WR — both CONFIRMED from lineup cards. TE eligibility assumed."
  - "Head-to-head with a 2-week playoff CONFIRMED; 12 teams and 6 playoff berths are NOT verified, and both move how much banking a stud is worth."
  - "Playoff opponents are modelled as better than average (a qualified team), using a 0.17 between-team variance share that is an estimate, not a fit."
  - "Each player is usable exactly once per season (player_reuse_limit: 1)."
