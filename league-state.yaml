# Rocco Siffredi — my league state. Update this after you set each week's lineup.
#
# `used_players` is the load-bearing field: in a one-use-per-player league these
# are permanently off the board, and the optimizer will never suggest them again.
# Names are matched loosely, so "Ja'Marr Chase" and "jamarr chase" both work.

current_week: 2

# 12 to start, one cut after week 1.
teams_remaining: 11

# Week 1 — the lineup recommended and confirmed ("Ok I like that lineup").
# ASSUMED to be what was actually entered. If the FLEX was swapped at the buzzer
# (Tee Higgins / Ladd McConkey / Chris Olave were the alternatives priced), fix
# the last line here and re-run `seedman optimize` — everything downstream
# follows from this list.
used_players:
  - Dak Prescott       # QB  DAL  14.40
  - Cam Skattebo       # RB  NYG  14.10
  - Rashee Rice        # WR  KC    8.90
  - Quentin Johnston   # WR  LAC   2.70
  - Dallas Goedert     # TE  PHI  21.70
  - Jameson Williams   # FLEX DET  6.50
  #                       week 1 total: 68.30

# Any NFL player is pickable each week (survivor rule, no draft).
available_players: []

# Real opponent totals, which beat the modelled cut line. One card seen so far:
# Josh Schorr, week 1. Reconciling it to the cent is what proved the league runs
# half PPR with NO yardage bonuses.
observed_field_scores:
  - 82.46   # week 1, Josh Schorr (Burrow / Achane / Lamb / Olave / LaPorta / C.Brown)
