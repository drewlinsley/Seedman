[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seedman"
version = "0.1.0"
description = "Survivor-fantasy-football lineup optimizer: balances season-long player inventory against weekly elimination risk."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pulp>=2.7",
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
seedman = "seedman.cli:main"

[tool.setuptools.packages.find]
include = ["seedman*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
